<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e2230"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Cricket Clash – Stat Card Game</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2230;--panel:#173448;--ink:#f2efe6;--mute:#8fa9b8;--red:#c8362b;--gold:#e8b63c;--win:#3fae6a;--lose:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e4eee8;--panel:#fff;--ink:#10241b;--mute:#4f6a5c}}
:root[data-theme="dark"]{--bg:#0e2230;--panel:#173448;--ink:#f2efe6;--mute:#8fa9b8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-weight:500;min-height:100vh}
main{max-width:960px;margin:0 auto;padding:16px}
h1,h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.04em;margin:0}
h1{font-size:2.4rem}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.score{display:flex;gap:16px;font-weight:700}
.score b{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.6rem;font-weight:400;color:var(--gold)}
.msg{margin:14px 0;padding:12px 14px;background:var(--panel);border-left:5px solid var(--gold);border-radius:6px;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:12px}
button{font:700 1rem Barlow,system-ui,sans-serif}
button.go{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.table{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lbl{font-weight:700;color:var(--mute);margin-bottom:6px}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:14px;padding:10px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card.back{background:repeating-linear-gradient(45deg,#1d4b3a 0 14px,#17402f 14px 28px);display:grid;place-items:center;min-height:420px;font-family:'Bebas Neue',Impact,sans-serif;font-size:2.2rem;letter-spacing:.1em;color:#e8b63c}
.head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px}
.nm{font-family:'Bebas Neue',Impact,sans-serif;font-size:1.7rem;line-height:1}
.role{font-size:.85rem;opacity:.85}
.av{display:block;margin:0 auto 6px;border-radius:10px;background:rgba(0,0,0,.22)}
.ab{font-size:.8rem;text-align:center;min-height:2.4em;padding:0 4px 6px}
.stats{background:rgba(0,0,0,.32);border-radius:10px;overflow:hidden}
.row{display:flex;justify-content:space-between;width:100%;padding:9px 12px;border:0;background:transparent;color:#fff;text-align:left;border-bottom:1px solid rgba(255,255,255,.12)}
.row:last-child{border-bottom:0}
.row i{font-style:normal;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.3rem}
button.row{cursor:pointer}
button.row:hover{background:rgba(255,255,255,.18)}
.row.win{background:var(--win)}.row.lose{background:var(--lose)}.row.tie{background:var(--gold);color:#222}
.pot{color:var(--mute);margin-top:12px;text-align:center}
.end{text-align:center;padding:30px 10px}
.end h2{font-size:3rem;margin-bottom:12px}
.menu{background:var(--panel);border-radius:10px;padding:16px;display:grid;gap:12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
button.opt{background:transparent;color:var(--ink);border:2px solid var(--mute);border-radius:8px;padding:9px 14px;cursor:pointer}
button.opt.on{background:var(--gold);border-color:var(--gold);color:#222}
.menu p{margin:0;color:var(--mute)}
input{font:700 1.1rem Barlow,system-ui,sans-serif;padding:9px 12px;border-radius:8px;border:2px solid var(--mute);background:var(--bg);color:var(--ink);width:7em;text-transform:uppercase}
.pile{display:flex;justify-content:center;min-height:160px;align-items:center}
.mini{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;border-radius:12px;width:110px;padding:10px 6px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.mini.hit{outline:4px solid var(--gold)}.mini.stack{margin-right:12px;box-shadow:0 5px 0 rgba(0,0,0,.25),6px 6px 0 -1px rgba(255,255,255,.3),12px 12px 0 -2px rgba(255,255,255,.18)}.mini.empty{background:var(--panel);color:var(--mute);box-shadow:none}.mini b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:3.6rem;line-height:1}
.mini span{font-size:.85rem}
@media (max-width:560px){.table{gap:8px}.card{padding:7px}.card.back{min-height:300px}.nm{font-size:1.2rem}.av{width:60px;height:60px}.row{padding:7px 8px;font-size:.85rem}.row i{font-size:1.1rem}.ab{font-size:.7rem}h1{font-size:1.9rem}}
@media (prefers-reduced-motion:no-preference){.card,.mini{animation:pop .22s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.4}}}
</style>
</head>

   return '<div><div class="lbl">'+nm(seat)+' pile ('+pl.length+')</div><div class="pile">'+(c===undefined?'<div class="mini empty"><b>–</b><span>empty</span></div>':mini(c,hit,pl.length))+'</div></div>'};
  B.innerHTML='<div class="table">'+slot(v)+slot(1-v)+'</div>';
  var mine=G.turn===v;M.textContent=msgI()+(mine?'':' '+nm(G.turn)+(nm(G.turn)==='You'?' are':' is')+' up next…');
  A.innerHTML=mine?'<button class="go" id="th">Throw card'+(opp==='hot'?' ('+nm(G.turn)+')':'')+'</button>':'';
  if(mine)$('th').onclick=function(){act('throw')};
  if(opp==='cpu'&&G.turn===1)tm=setTimeout(function(){if(G&&G.turn===1)exec(1,'throw')},800)}}

function home(){if(room){try{room.leave()}catch(e){}room=null}clearInterval(hb);G=null;wait=false;code='';note='';render()}
function opt(a,k,val,txt,on){return '<button class="opt'+(on?' on':'')+'" data-'+a+'="'+val+'">'+txt+'</button>'}
function menu(){
 $('score').innerHTML='';$('pot').textContent='';$('msg').textContent='Pick a game and an opponent.';$('act').innerHTML='';
 var h='<div class="menu"><div class="lbl">Game</div><div class="opts">'+opt('g','g','s','Stat Battle',sm==='s')+opt('g','g','i','Initial Match',sm==='i')+'</div>'
 +'<p>'+(sm==='s'?'Pick a stat. The higher number wins both cards. Some cards have special abilities.':'Each player throws onto their own pile. If your card has the same first-name initial as the top card of the other pile, you win every card on both piles.')+'</p>'
 +'<div class="lbl">Cards in the game</div><div class="opts">'+[20,30,40,60,100,150,P.length-P.length%2].map(function(n){return opt('c','c',n,n===P.length-P.length%2?'All '+n:n,cnt===n)}).join('')+'</div><p>'+(cnt/2)+' cards each, picked at random from '+P.length+' cricketers. Stats are approximate career figures, just for fun.</p>'
 +'<div class="lbl">Opponent</div><div class="opts">'+opt('o','o','cpu','CPU',so==='cpu')+opt('o','o','hot','Friend, same phone',so==='hot')+opt('o','o','net','Friend, online',so==='net')+'</div>';
 if(so==='net'){
  if(R===null)h+='<p>Online play only works in the Claude-hosted version of this game, opened while signed in with your friend invited. It is not available in the installed app.</p>';
  else if(R===undefined)h+='<p>Checking online play…</p>';
  else if(wait)h+='<p>Your game code is <b style="color:var(--gold);font-size:1.4rem">'+code.toUpperCase()+'</b>. Your friend opens this page, picks Friend online, and joins with the code. Waiting…</p>';
  else h+='<div class="opts"><button class="go" id="host">Host a game</button><input id="cd" maxlength="6" placeholder="Code"><button class="go" id="join">Join</button></div>'+(note?'<p>'+note+'</p>':'');
 }else h+='<button class="go" id="start">Start game</button>';
 $('board').innerHTML=h+'</div>';
 document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){sm=b.dataset.g;render()}});
 document.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){so=b.dataset.o;render()}});
 document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){cnt=+b.dataset.c;render()}});
 if($('start'))$('start').onclick=function(){opp=so;me=0;G=deal(sm);cover=opp==='hot'&&sm==='s';render()};
 if($('host'))$('host').onclick=hostGame;
 if($('join'))$('join').onclick=function(){joinGame($('cd').value)}}
function rn(c){return 'cc-'+c.toLowerCase().replace(/[^a-z0-9]/g,'')}
function hostGame(){code=Math.random().toString(36).slice(2,6);R.join(rn(code)).then(function(rm){room=rm;host=true;me=0;opp='net';wait=true;
  rm.on('hi',function(m){if(m.isMe)return;if(!G)G=deal(sm);em('st',G);render()});
  rm.on('act',function(m){if(m.isMe)return;var d=m.data||{};exec(1,d.k,d.v)});render()}).catch(function(){note='Could not open a room. Try again.';wait=false;render()})}
function joinGame(c){c=(c||'').replace(/[^a-zA-Z0-9]/g,'');if(c.length<3){note='Enter the code your friend shared.';render();return}
 R.join(rn(c)).then(function(rm){room=rm;host=false;me=1;opp='net';
  rm.on('st',function(m){if(m.isMe||!okg(m.data))return;G=m.data;sm=G.mode;clearInterval(hb);render()});
  em('hi',{});hb=setInterval(function(){if(G)clearInterval(hb);else em('hi',{})},3000);
  note='Joined. Waiting for the host…';$('msg').textContent=note}).catch(function(){note='Could not join that code.';render()})}
if(window.claude&&claude.use){claude.use('room').then(function(x){R=x;if(!G)render()}).catch(function(){R=null;if(!G)render()})}else R=null;
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
